name: QuantumShield Scientific CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  scientific-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Scientific & Quantum Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir rdkit qiskit qiskit-algorithms numpy scipy pytest requests

      - name: Run Scientific Integrity & Mathematical Audit
        run: |
          pytest test_scientific_integrity.py -v

      - name: Run Clinical Efficacy & VQE Accuracy Validation
        run: |
          python test_accuracy_validation.py

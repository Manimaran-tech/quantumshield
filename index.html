<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuantumShield — Quantum Drug Discovery, A to Z</title>
  <link rel="icon" type="image/png" href="/assets/logo1_square.png" />
  <meta name="description"
    content="QuantumShield compresses early-stage drug discovery from years to hours with a hybrid QM/MM pipeline, Variational Quantum Eigensolver, and reinforcement-learning generative chemistry.">

  <!-- Spline viewer -->
  <link rel="preload" href="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js" as="script" crossorigin>
  <link rel="preload" href="dna_scene.splinecode" as="fetch">
  <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js"></script>
  <link rel="prefetch" href="/app.html">

  <!-- Premium type system -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&family=Roboto+Slab:wght@300..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      /* Original palette — preserved */
      --bg: #f4f4f6;
      --light-grey: #e1e2e4;
      --mid-grey: #c5c6c8;
      --charcoal: #3e4145;
      --slate: #4d5c66;
      --teal: #138aa5;
      --teal-deep: #0c6d83;

      --display: 'Montserrat', sans-serif;
      --sans: 'Montserrat', sans-serif;
      --mono: 'JetBrains Mono', 'Courier New', monospace;
      --slab: 'Roboto Slab', serif;

      --fluid-font: clamp(14px, 0.78vw + 8.5px, 19px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
      /* sharp-corner default, specific overrides allowed */
    }

    html {
      scroll-behavior: auto;
      font-size: var(--fluid-font);
    }

    body {
      background: var(--bg);
      color: var(--charcoal);
      font-family: var(--sans);
      overflow-x: hidden;
      overflow-y: scroll;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      position: relative;
    }

    ::selection {
      background: var(--teal);
      color: var(--bg);
    }

    /* ============================================================
       FIXED BACKGROUND LAYER — Spline DNA never moves
       ============================================================ */
    .bg-stack {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .dna-viewport {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    spline-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      transform: scale(1.3);
      transform-origin: center center;
      pointer-events: none !important;
      opacity: 0;
      transition: opacity 0.6s ease;
      --spline-viewer-logo-display: none !important;
    }

    spline-viewer::part(logo) {
      display: none !important;
    }

    /* CSS DNA placeholder while Spline loads */
    .dna-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transition: opacity 0.7s ease;
    }

    .css-dna {
      position: relative;
      width: 88px;
      height: 420px;
      opacity: 0.85;
    }

    .css-dna .base-pair {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: helix 2.8s ease-in-out infinite;
    }

    .css-dna .node {
      width: 10px;
      height: 10px;
      border-radius: 50% !important;
      flex-shrink: 0;
    }

    .css-dna .node-left {
      background: var(--teal);
      box-shadow: 0 0 8px rgba(19, 138, 165, .45);
    }

    .css-dna .node-right {
      background: var(--mid-grey);
      box-shadow: 0 0 6px rgba(197, 198, 200, .5);
    }

    .css-dna .bridge {
      flex: 1;
      height: 1.5px;
      margin: 0 2px;
      opacity: .5;
      background: linear-gradient(90deg, var(--teal), var(--light-grey), var(--mid-grey));
    }

    @keyframes helix {
      0% {
        transform: translateX(-50%) scaleX(1)
      }

      25% {
        transform: translateX(-50%) scaleX(.14)
      }

      50% {
        transform: translateX(-50%) scaleX(-1)
      }

      75% {
        transform: translateX(-50%) scaleX(.14)
      }

      100% {
        transform: translateX(-50%) scaleX(1)
      }
    }

    /* scrim: lighter in the central reading band (text legible), DNA stays
       clearly visible toward the edges — content reads, DNA never moves. */
    .bg-scrim {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse 52% 44% at 50% 50%, rgba(244, 244, 246, .52) 0%, rgba(244, 244, 246, .28) 45%, rgba(244, 244, 246, 0) 75%),
        linear-gradient(180deg, rgba(244, 244, 246, .5) 0%, rgba(244, 244, 246, 0) 10%, rgba(244, 244, 246, 0) 90%, rgba(244, 244, 246, .5) 100%);
      pointer-events: none;
    }

    /* faint grid texture */
    .bg-grid {
      position: absolute;
      inset: 0;
      z-index: 2;
      background-image:
        linear-gradient(rgba(19, 138, 165, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(19, 138, 165, .035) 1px, transparent 1px);
      background-size: 64px 64px;
      background-position: center;
      opacity: .5;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 75%);
      pointer-events: none;
    }

    /* ============================================================
       CHROME — top progress + nav + counter
       ============================================================ */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--teal);
      z-index: 200;
      box-shadow: 0 0 10px rgba(19, 138, 165, .7);
    }

    .chromium-top {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90vw;
      max-width: 1340px;
      height: 72px;
      z-index: 150;
      pointer-events: auto;
      border-radius: 36px;
      background: rgba(244, 244, 246, 0.65);
      backdrop-filter: blur(24px) saturate(125%) brightness(1.02);
      -webkit-backdrop-filter: blur(24px) saturate(125%) brightness(1.02);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.45) inset,
        0 8px 32px 0 rgba(62, 65, 69, 0.05),
        inset 0 -1px 0 0 rgba(62, 65, 69, 0.02);
      box-sizing: border-box;
      overflow: hidden;
    }

    .nav-content-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      padding: 0 28px;
      position: relative;
      z-index: 2;
    }

    .brand {
      flex: 1;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      transition: transform 0.4s ease;
    }

    .brand h1 {
      font-family: var(--display);
      font-size: 1.0625rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--charcoal);
    }

    .brand .sub {
      margin-left: 1px;
      font-family: var(--slab);
      font-size: 8.5px;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--teal);
    }

    .top-nav {
      flex: 1;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
    }

    .top-nav .live {
      font-family: var(--sans);
      font-size: 8.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--slate);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .top-nav .live .dot {
      width: 6px;
      height: 6px;
      border-radius: 50% !important;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .4
      }

      50% {
        opacity: 1
      }
    }

    .btn-enter {
      pointer-events: auto;
      padding: 11px 22px;
      border: 1px solid rgba(62, 65, 69, 0.25);
      background: rgba(244, 244, 246, 0.45);
      backdrop-filter: blur(12px) saturate(110%);
      -webkit-backdrop-filter: blur(12px) saturate(110%);
      color: var(--charcoal);
      font-family: var(--sans);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color .35s ease, color .35s ease, box-shadow .35s ease, background-color .35s ease;
      z-index: 10;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .btn-enter::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--charcoal);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .5s cubic-bezier(.16, 1, .3, 1);
      z-index: -1;
      pointer-events: none;
      border-radius: 9999px;
    }

    .btn-enter:hover {
      color: var(--bg);
      border-color: var(--charcoal);
      box-shadow: 0 4px 12px rgba(62, 65, 69, 0.15);
    }

    .btn-enter:hover::before {
      transform: scaleX(1);
    }

    /* ============================================================
       SCENE DECK — fixed crossfading scenes
       ============================================================ */
    .deck {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: auto;
      opacity: 0;
      transition: opacity .8s cubic-bezier(.16, 1, .3, 1) .2s;
    }

    .deck.loaded {
      opacity: 1;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 112px 6vw 48px;
      opacity: 0;
      will-change: opacity, transform, filter;
      transform: translateY(22px) scale(.99);
      filter: blur(7px);
      /* opacity + transform are SCRUBBED directly to scroll position (no
         transition) for a premium 1:1 tracking feel; only focus softens. */
      transition: filter .5s cubic-bezier(.16, 1, .3, 1);
      pointer-events: none;
      overflow-y: hidden;
      box-sizing: border-box;
    }

    .scene::before,
    .scene::after {
      content: '';
      flex-grow: 1;
      min-height: 0;
    }

    .scene::-webkit-scrollbar {
      width: 6px;
    }

    .scene::-webkit-scrollbar-track {
      background: transparent;
    }

    .scene::-webkit-scrollbar-thumb {
      background: rgba(62, 65, 69, 0.15);
      border-radius: 3px;
    }

    .scene::-webkit-scrollbar-thumb:hover {
      background: rgba(62, 65, 69, 0.3);
    }

    .scene.is-active {
      filter: blur(0);
      pointer-events: auto;
      overflow-y: auto;
    }

    .scene-inner {
      width: 100%;
      max-width: 1340px;
      display: grid;
      grid-template-columns: 1fr minmax(360px, 0.85fr);
      gap: 56px;
      align-items: center;
      pointer-events: auto;
    }

    .scene-inner.dual-left {
      grid-template-columns: minmax(360px, 0.85fr) 1fr;
    }

    .scene-inner.stacked {
      grid-template-columns: 1fr;
      max-width: 900px;
    }

    /* Centered Hero Scene details */
    #scene-hero .col-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    #scene-hero .eyebrow {
      justify-content: center;
    }

    #scene-hero .lede {
      margin-left: auto;
      margin-right: auto;
    }

    .hero-scroll-hint {
      margin-top: 40px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--teal);
      animation: heroPulse 2s infinite ease-in-out;
    }

    @keyframes heroPulse {

      0%,
      100% {
        opacity: 0.5;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(6px);
      }
    }

    /* Text column */
    .col-text {
      pointer-events: none;
    }

    .eyebrow {
      font-family: var(--slab);
      font-size: 9.5px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--teal);
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .eyebrow .n {
      color: var(--charcoal);
    }

    .eyebrow .bar {
      width: 26px;
      height: 1px;
      background: var(--teal);
      opacity: .7;
    }

    .scene h2 {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(2.125rem, 4.6vw, 3.75rem);
      line-height: 1.02;
      letter-spacing: -0.5px;
      color: var(--charcoal);
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .scene h2 .accent {
      color: var(--teal);
    }

    .scene h2 em {
      font-style: normal;
      color: var(--slate);
    }

    .lede {
      font-family: var(--sans);
      font-size: 16.5px;
      line-height: 1.6;
      color: var(--charcoal);
      font-weight: 400;
      max-width: 52ch;
    }

    .lede strong {
      font-weight: 600;
      color: var(--charcoal);
    }

    .lede .muted {
      color: var(--slate);
    }

    .fact-list {
      list-style: none;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .fact {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 16px;
      align-items: start;
      padding-top: 14px;
      border-top: 1px solid rgba(62, 65, 69, .14);
    }

    .fact .k {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--teal);
      font-weight: 600;
      padding-top: 2px;
    }

    .fact .v {
      font-size: 14px;
      line-height: 1.5;
      color: var(--charcoal);
    }

    .fact .v b {
      font-weight: 600;
    }

    .formula {
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--charcoal);
      background: rgba(62, 65, 69, .04);
      padding: 12px 16px;
      margin: 14px 0;
      border-left: 2px solid var(--teal);
    }

    .formula .cap {
      display: block;
      font-size: 9.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 6px;
    }

    .layer-chart {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 26px;
    }

    .layer-row {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 11px 14px;
      border: 1px solid rgba(62, 65, 69, .16);
      background: rgba(244, 244, 246, .5);
      backdrop-filter: blur(2px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: default;
      position: relative;
      overflow: hidden;
      pointer-events: auto;
      z-index: 1;
    }

    .layer-row>* {
      position: relative;
      z-index: 2;
    }

    .layer-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--teal);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 3;
    }

    .layer-row::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #121315;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: -1;
      pointer-events: none;
    }

    .layer-row:hover {
      border-color: var(--teal);
      transform: translateX(8px);
      box-shadow: 0 8px 24px rgba(19, 138, 165, 0.2);
      padding-left: 18px;
    }

    .layer-row:hover::before {
      transform: scaleY(1);
    }

    .layer-row:hover::after {
      transform: scaleX(1);
    }

    .layer-row .ln {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--teal);
      font-weight: 600;
      transition: color .3s ease, letter-spacing .3s ease;
    }

    .layer-row:hover .ln {
      letter-spacing: 2px;
      color: #14b8a6;
    }

    .layer-row .lt {
      font-family: var(--sans);
      font-size: 12.5px;
      color: var(--charcoal);
      font-weight: 600;
      transition: color .3s ease;
    }

    .layer-row:hover .lt {
      color: #ffffff;
    }

    .layer-row .ld {
      display: block;
      font-size: 11px;
      color: var(--slate);
      font-weight: 400;
      margin-top: 2px;
      transition: color .3s ease;
    }

    .layer-row:hover .ld {
      color: #94a3b8;
    }

    .layer-row .ls {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--slate);
      letter-spacing: 1px;
      transition: color .3s ease;
    }

    .layer-row:hover .ls {
      color: #cbd5e1;
    }

    /* Art column */
    .col-art {
      pointer-events: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
    }

    .art-frame {
      position: relative;
      width: 100%;
      max-width: 700px;
      aspect-ratio: 1.25;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .art-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .art-frame .opt-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      transition: opacity .4s ease, clip-path .95s cubic-bezier(.16, 1, .3, 1), transform .55s cubic-bezier(.16, 1, .3, 1);
      z-index: 3;
    }

    .art-frame .opt-img.on {
      opacity: 1;
    }

    .scene.is-active .art-frame .opt-img.on {
      clip-path: inset(0 0 0 0);
    }

    .art-caption {
      position: absolute;
      bottom: -2px;
      left: 0;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--slate);
    }

    /* shared svg stroke helpers */
    .svg-teal {
      stroke: var(--teal);
    }

    .svg-char {
      stroke: var(--charcoal);
    }

    .svg-grey {
      stroke: var(--mid-grey);
    }

    .svg-fill-teal {
      fill: var(--teal);
    }

    .svg-fill-grey {
      fill: var(--mid-grey);
    }

    /* CTA scene */
    .cta-card {
      text-align: center;
    }

    .cta-card .stat-row {
      display: flex;
      gap: 48px;
      justify-content: center;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .cta-card .stat .num {
      font-family: var(--display);
      font-size: clamp(1.875rem, 3.4vw, 2.875rem);
      color: var(--teal);
      font-weight: 600;
    }

    .cta-card .stat .lab {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--slate);
      margin-top: 4px;
    }

    /* ============================================================
       SCENE NAVIGATOR (top center floating pill bar)
       ============================================================ */
    .nav-pill-container {
      position: relative;
      pointer-events: auto;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-pill-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(62, 65, 69, 0.12);
      border-radius: 30px;
      padding: 5px 6px;
      box-shadow: 0 8px 24px rgba(62, 65, 69, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nav-pill-item {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--slate);
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      user-select: none;
    }

    .nav-pill-item:hover {
      color: var(--charcoal);
      background: rgba(62, 65, 69, 0.05);
    }

    .nav-pill-item.active {
      color: #ffffff;
      background: var(--charcoal);
      box-shadow: 0 2px 6px rgba(62, 65, 69, 0.15);
    }

    /* counter bottom-left */
    .counter {
      position: fixed;
      bottom: 26px;
      left: 34px;
      z-index: 160;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--slate);
      pointer-events: none;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .counter .now {
      font-size: 13px;
      color: var(--charcoal);
      font-weight: 600;
    }

    .counter .sep {
      opacity: .5;
    }

    /* scroll hint */
    .scroll-hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 160;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--slate);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: opacity .4s ease;
    }

    .scroll-hint .arr {
      color: var(--teal);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-5px)
      }
    }

    /* ============================================================
       SCENE ENTRANCE — text flows / moves per scene (premium tell)
       Each scene carries one .fx-* class (set by engine). On .is-active
       the heading + body pieces animate in from a direction, staggered.
       Decoupled from scroll velocity so arrivals always feel calm.
       ============================================================ */
    @keyframes riseUp {
      from {
        opacity: 0;
        transform: translateY(36px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes flowLr {
      from {
        opacity: 0;
        transform: translateX(-40px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes flowRl {
      from {
        opacity: 0;
        transform: translateX(40px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(.93)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes maskDown {
      from {
        opacity: 0;
        clip-path: inset(0 0 100% 0)
      }

      to {
        opacity: 1;
        clip-path: inset(0 0 0 0)
      }
    }

    @keyframes wipeR {
      from {
        opacity: 0;
        transform: translateX(-26px);
        clip-path: inset(0 100% 0 0)
      }

      to {
        opacity: 1;
        transform: translateX(0);
        clip-path: inset(0 0 0 0)
      }
    }

    @keyframes wipeL {
      from {
        opacity: 0;
        transform: translateX(26px);
        clip-path: inset(0 0 0 100%)
      }

      to {
        opacity: 1;
        transform: translateX(0);
        clip-path: inset(0 0 0 0)
      }
    }

    .fx-rise {
      --fx: riseUp;
      --fx-h: riseUp;
    }

    .fx-lr {
      --fx: flowLr;
      --fx-h: wipeR;
    }

    /* text flows left → right */
    .fx-rl {
      --fx: flowRl;
      --fx-h: wipeL;
    }

    /* text flows right → left */
    .fx-scale {
      --fx: scaleIn;
      --fx-h: scaleIn;
    }

    .fx-mask {
      --fx: riseUp;
      --fx-h: maskDown;
    }

    .scene.is-active .eyebrow {
      animation: var(--fx) .82s both cubic-bezier(.16, 1, .3, 1) .06s;
    }

    .scene.is-active h2 {
      animation: var(--fx-h) 1.00s both cubic-bezier(.16, 1, .3, 1) .16s;
    }

    .scene.is-active .lede {
      animation: var(--fx) .85s both cubic-bezier(.16, 1, .3, 1) .30s;
    }

    .scene.is-active .formula,
    .scene.is-active pre.formula {
      animation: var(--fx) .80s both cubic-bezier(.16, 1, .3, 1) .40s;
    }

    .scene.is-active .cta-card {
      animation: var(--fx) .95s both cubic-bezier(.16, 1, .3, 1) .42s;
    }

    .scene.is-active .art-frame {
      animation: scaleIn 1.00s both cubic-bezier(.16, 1, .3, 1) .30s;
    }

    .scene.is-active .fact {
      animation: var(--fx) .80s both cubic-bezier(.16, 1, .3, 1);
    }

    .scene.is-active .fact:nth-child(1) {
      animation-delay: .46s;
    }

    .scene.is-active .fact:nth-child(2) {
      animation-delay: .56s;
    }

    .scene.is-active .fact:nth-child(3) {
      animation-delay: .66s;
    }

    .scene.is-active .fact:nth-child(4) {
      animation-delay: .76s;
    }

    .scene.is-active .fact:nth-child(5) {
      animation-delay: .86s;
    }

    .scene.is-active .layer-row {
      animation: var(--fx) .80s both cubic-bezier(.16, 1, .3, 1);
    }

    .scene.is-active .layer-row:nth-child(1) {
      animation-delay: .46s;
    }

    .scene.is-active .layer-row:nth-child(2) {
      animation-delay: .54s;
    }

    .scene.is-active .layer-row:nth-child(3) {
      animation-delay: .62s;
    }

    .scene.is-active .layer-row:nth-child(4) {
      animation-delay: .70s;
    }

    .scene.is-active .layer-row:nth-child(5) {
      animation-delay: .78s;
    }

    .scene.is-active .layer-row:nth-child(6) {
      animation-delay: .86s;
    }

    /* inline code polish */
    code {
      font-family: var(--mono);
      font-size: .88em;
      letter-spacing: .2px;
      color: var(--teal-deep);
    }

    @media (prefers-reduced-motion: reduce) {

      .scene.is-active .eyebrow,
      .scene.is-active h2,
      .scene.is-active .lede,
      .scene.is-active .formula,
      .scene.is-active pre.formula,
      .scene.is-active .cta-card,
      .scene.is-active .art-frame,
      .scene.is-active .fact,
      .scene.is-active .layer-row,
      .scene.is-active .eyebrow .q-ch {
        animation: none !important;
      }
    }

    /* ============================================================
       PREMIUM HOVER DETAILS — blueprint / technical tone
       (the "Enter Platform" button + exit overlay are untouched)
       ============================================================ */
    .scene h2 .accent {
      position: relative;
      transition: text-shadow .4s ease;
    }

    .scene h2 .accent::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: .08em;
      height: 2px;
      width: 0;
      background: var(--teal);
      transition: width .5s cubic-bezier(.16, 1, .3, 1);
    }

    .scene h2:hover .accent::after {
      width: 100%;
    }

    .scene h2:hover .accent {
      text-shadow: 0 0 20px rgba(19, 138, 165, .32);
    }

    .eyebrow .bar {
      transition: width .45s cubic-bezier(.16, 1, .3, 1), background .3s;
    }

    .eyebrow:hover .bar {
      width: 58px;
    }

    .lede strong {
      transition: color .3s ease;
    }

    .lede:hover strong {
      color: var(--teal-deep);
    }

    .fact {
      position: relative;
      overflow: hidden;
      padding-left: 0;
      transition: padding-left .4s cubic-bezier(.16, 1, .3, 1), background-color .35s ease, border-color .35s ease;
    }

    .fact::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--teal);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform .5s cubic-bezier(.16, 1, .3, 1);
    }

    .fact:hover {
      background: rgba(19, 138, 165, .06);
      border-top-color: rgba(19, 138, 165, .45);
      padding-left: 16px;
    }

    .fact:hover::before {
      transform: scaleY(1);
    }

    .fact .k {
      transition: color .3s ease, letter-spacing .3s ease;
    }

    .fact:hover .k {
      letter-spacing: 2.6px;
    }

    .fact:hover .v b {
      color: var(--teal-deep);
    }

    .formula {
      transition: border-left-width .4s ease, background-color .4s ease, box-shadow .4s ease;
    }

    .formula:hover {
      border-left-width: 5px;
      background-color: rgba(19, 138, 165, .07);
      box-shadow: 0 8px 22px rgba(19, 138, 165, .08);
    }

    .art-frame {
      position: relative;
    }

    .art-frame::before {
      content: '';
      position: absolute;
      inset: -7px;
      border: 1px solid var(--teal);
      opacity: 0;
      transform: scale(.96);
      transition: opacity .45s ease, transform .45s cubic-bezier(.16, 1, .3, 1);
      pointer-events: none;
      z-index: 6;
    }

    .col-art:hover .art-frame::before {
      opacity: .55;
      transform: scale(1);
    }

    .art-frame svg {
      transition: filter .45s ease, transform .55s cubic-bezier(.16, 1, .3, 1), opacity 0.4s ease;
    }

    .art-frame .opt-img {
      transition: opacity .4s ease, clip-path .95s cubic-bezier(.16, 1, .3, 1), transform .55s cubic-bezier(.16, 1, .3, 1);
    }

    .col-art:hover .art-frame svg {
      transform: scale(1.03);
      filter: drop-shadow(0 0 14px rgba(19, 138, 165, .2));
    }

    .col-art:hover .art-frame .opt-img.on {
      transform: scale(1.05);
      clip-path: inset(0 0 0 0);
      filter: drop-shadow(0 0 14px rgba(19, 138, 165, .2));
    }

    /* Fade out underlying SVG schematic when image is loaded and active */
    .scene.is-active .art-frame.has-img svg {
      opacity: 0;
    }

    .art-caption {
      transition: color .3s ease, letter-spacing .3s ease, transform .4s ease;
    }

    .col-art:hover .art-caption {
      color: var(--teal);
      letter-spacing: 3px;
      transform: translateX(8px);
    }

    .crosshair {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 7;
      border: 0 solid var(--teal);
      opacity: 0;
      transition: opacity .4s ease, transform .45s cubic-bezier(.16, 1, .3, 1);
    }

    .ch-tl {
      top: 6px;
      left: 6px;
      border-top-width: 1.5px;
      border-left-width: 1.5px;
      transform: translate(8px, 8px);
    }

    .ch-tr {
      top: 6px;
      right: 6px;
      border-top-width: 1.5px;
      border-right-width: 1.5px;
      transform: translate(-8px, 8px);
    }

    .ch-bl {
      bottom: 6px;
      left: 6px;
      border-bottom-width: 1.5px;
      border-left-width: 1.5px;
      transform: translate(8px, -8px);
    }

    .ch-br {
      bottom: 6px;
      right: 6px;
      border-bottom-width: 1.5px;
      border-right-width: 1.5px;
      transform: translate(-8px, -8px);
    }

    .col-art:hover .crosshair {
      opacity: .9;
      transform: translate(0, 0);
    }

    .brand {
      cursor: default;
    }

    .brand:hover .brand-logo {
      transform: scale(1.1) rotate(15deg);
    }

    .brand h1 {
      transition: color .35s ease;
    }

    .brand:hover h1 {
      color: var(--teal-deep);
    }

    .top-nav .live {
      transition: color .3s ease;
      cursor: default;
    }

    .top-nav .live .dot {
      transition: animation-duration .3s ease;
    }

    .top-nav .live:hover {
      color: var(--charcoal);
    }

    .top-nav .live:hover .dot {
      animation-duration: .9s;
    }

    /* spacer that creates scroll length */
    .scroller {
      position: relative;
      width: 1px;
      z-index: -1;
    }

    /* page exit animation on transition */
    body.transitioning-out .bg-stack,
    body.transitioning-out .deck,
    body.transitioning-out .chromium-top,
    body.transitioning-out .nav-rail,
    body.transitioning-out .counter,
    body.transitioning-out .scroll-hint,
    body.transitioning-out .progress-bar {
      transition: opacity .45s ease, transform .45s ease;
      opacity: 0 !important;
      transform: scale(.98) !important;
    }

    body.transitioning-out .progress-bar {
      transform: none !important;
    }

    /* ============================================================
       TRANSITION OVERLAY (cinematic exit → /app.html) — preserved
       ============================================================ */
    .transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .transition-overlay.active {
      pointer-events: all;
      opacity: 1;
      visibility: visible;
    }

    .transition-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(244, 244, 246, 0);
      backdrop-filter: blur(0);
      -webkit-backdrop-filter: blur(0);
      transition: background .6s cubic-bezier(.4, 0, .2, 1), backdrop-filter .6s cubic-bezier(.4, 0, .2, 1), -webkit-backdrop-filter .6s cubic-bezier(.4, 0, .2, 1);
    }

    .transition-overlay.active .transition-backdrop {
      background: rgba(244, 244, 246, .92);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
    }

    .pathogen-hud-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(.6);
      width: 360px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      z-index: 5;
      transition: opacity .5s cubic-bezier(.16, 1, .3, 1) .15s, transform .5s cubic-bezier(.16, 1, .3, 1) .15s;
    }

    .transition-overlay.active .pathogen-hud-container {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .pathogen-image {
      width: 220px;
      height: 220px;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: drop-shadow(0 0 15px rgba(19, 138, 165, .15));
      z-index: 3;
      transition: transform .4s ease, filter .4s ease;
    }

    .target-bracket {
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: var(--teal);
      border-style: solid;
      border-width: 0;
      z-index: 4;
      transition: border-width .4s ease .4s, inset .4s cubic-bezier(.25, 1, .5, 1) .4s;
    }

    .bracket-tl {
      top: 45px;
      left: 45px;
      border-top-width: 2px;
      border-left-width: 2px
    }

    .bracket-tr {
      top: 45px;
      right: 45px;
      border-top-width: 2px;
      border-right-width: 2px
    }

    .bracket-bl {
      bottom: 45px;
      left: 45px;
      border-bottom-width: 2px;
      border-left-width: 2px
    }

    .bracket-br {
      bottom: 45px;
      right: 45px;
      border-bottom-width: 2px;
      border-right-width: 2px
    }

    .transition-overlay.active .bracket-tl {
      top: 55px;
      left: 55px
    }

    .transition-overlay.active .bracket-tr {
      top: 55px;
      right: 55px
    }

    .transition-overlay.active .bracket-bl {
      bottom: 55px;
      left: 55px
    }

    .transition-overlay.active .bracket-br {
      bottom: 55px;
      right: 55px
    }

    .hud-scanner-rings {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }

    .scanner-ring {
      position: absolute;
      border-radius: 50% !important;
    }

    .ring-outer {
      width: 330px;
      height: 330px;
      border: 1px dotted rgba(19, 138, 165, .2);
      animation: spc 20s linear infinite
    }

    .ring-middle {
      width: 290px;
      height: 290px;
      border: 1px solid rgba(19, 138, 165, .15);
      border-left-color: var(--teal);
      border-right-color: var(--teal);
      animation: spcc 8s linear infinite
    }

    .ring-inner {
      width: 250px;
      height: 250px;
      border: 1px dashed var(--teal);
      border-color: rgba(19, 138, 165, .2);
      border-top-color: var(--teal);
      animation: spc 4s linear infinite
    }

    @keyframes spc {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes spcc {
      to {
        transform: rotate(-360deg)
      }
    }

    .scanner-sweep-line {
      position: absolute;
      left: 15%;
      width: 70%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      box-shadow: 0 0 10px var(--teal);
      top: 60px;
      z-index: 4;
      animation: lsweep 2s ease-in-out infinite alternate;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .transition-overlay.active .scanner-sweep-line {
      opacity: .85;
    }

    @keyframes lsweep {
      from {
        top: 60px
      }

      to {
        top: 300px
      }
    }

    .target-stats-overlay {
      position: absolute;
      bottom: 5px;
      text-align: center;
      font-family: var(--mono);
      font-size: 8px;
      color: var(--teal);
      letter-spacing: 1px;
      font-weight: bold;
      opacity: .8;
      line-height: 1.5;
    }

    .progress-bar-container {
      position: absolute;
      top: calc(50% + 210px);
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .progress-bar-text {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--teal);
      font-weight: 700;
      white-space: nowrap;
      transition: color .3s ease;
    }

    .progress-bar-track {
      width: 100%;
      height: 6px;
      background: rgba(19, 138, 165, .12);
      border: 1px solid rgba(19, 138, 165, .2);
      overflow: hidden;
      border-radius: 3px !important;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
      transition: width .1s linear;
      border-radius: 3px !important;
    }

    .watermark-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .watermark-node {
      position: absolute;
      font-family: var(--mono);
      color: var(--teal);
      opacity: 0;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      font-weight: 700;
      transition: opacity 0.5s ease;
    }

    .particle-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal);
      opacity: 0;
    }

    .flash-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      opacity: 0;
      transition: opacity .25s cubic-bezier(.4, 0, 1, 1);
      z-index: 100;
    }

    .transition-overlay.flash .flash-overlay {
      opacity: 1;
    }

    @media (max-width: 1100px) {
      .top-nav .live {
        display: none;
      }
    }

    @media (max-width: 900px) {

      .scene-inner,
      .scene-inner.dual-left {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .scene {
        padding: 84px 7vw 76px;
      }

      .col-art {
        min-height: 220px;
      }

      .art-frame {
        max-width: 480px;
      }

      .nav-rail {
        right: 14px;
      }

      .chromium-top {
        width: 94vw;
        height: 64px;
        top: 12px;
        border-radius: 32px;
      }

      .nav-content-wrapper {
        padding: 0 16px;
      }

      .brand .sub {
        display: none;
      }

      .top-nav .live {
        display: none;
      }
    }

    /* ============================================================
       LANDO TECHNIQUES: SPLIT-TEXT ROLL & MODULES REVEAL GRID
       ============================================================ */
    .q-ch {
      display: inline-block;
      transition: transform .4s cubic-bezier(.16, 1, .3, 1);
      position: relative;
    }

    .q-ch::after {
      content: attr(data-letter);
      position: absolute;
      left: 0;
      top: 100%;
      color: inherit;
      pointer-events: none;
    }

    [data-roll]:hover .q-ch {
      transform: translateY(-100%);
    }

    @keyframes qchIn {
      from {
        opacity: 0;
        clip-path: inset(0 0 100% 0);
        transform: translateY(0.4em);
      }

      to {
        opacity: 1;
        clip-path: inset(0 0 0 0);
        transform: translateY(0);
      }
    }

    .scene.is-active .eyebrow .q-ch {
      animation: qchIn .6s both cubic-bezier(.16, 1, .3, 1);
      animation-delay: calc(.12s + var(--i) * 0.025s);
    }

    .qbtn-text {
      position: relative;
      z-index: 2;
    }

    .qbtn-arr {
      display: inline-block;
      transition: transform .35s cubic-bezier(.16, 1, .3, 1);
      position: relative;
      z-index: 2;
    }

    .btn-enter:hover .qbtn-arr {
      transform: translate(3px, -3px);
    }

    /* Modules Ticker Layout */
    .mods-ticker-container {
      position: relative;
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      overflow: hidden;
      margin-top: 32px;
      padding: 15px 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Fade-out edge gradients */
    .mods-ticker-container::before,
    .mods-ticker-container::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 120px;
      z-index: 10;
      pointer-events: none;
    }

    .mods-ticker-container::before {
      left: 0;
      background: linear-gradient(90deg, var(--bg) 0%, transparent 100%);
    }

    .mods-ticker-container::after {
      right: 0;
      background: linear-gradient(-90deg, var(--bg) 0%, transparent 100%);
    }

    .mods-ticker-lane {
      display: flex;
      gap: 48px;
      width: max-content;
    }

    .mods-ticker-lane.is-rtl {
      animation: tickerRTL 24s linear infinite;
    }

    .mods-ticker-lane.is-ltr {
      animation: tickerLTR 24s linear infinite;
    }

    .mods-ticker-lane:hover {
      animation-play-state: paused;
    }

    @keyframes tickerRTL {
      0% {
        transform: translate3d(0, 0, 0);
      }

      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }

    @keyframes tickerLTR {
      0% {
        transform: translate3d(-50%, 0, 0);
      }

      100% {
        transform: translate3d(0, 0, 0);
      }
    }

    .mod-card {
      position: relative;
      width: 230px;
      flex-shrink: 0;
      border: 1px solid rgba(62, 65, 69, .16);
      background: rgba(244, 244, 246, .5);
      backdrop-filter: blur(2px);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all .4s cubic-bezier(.16, 1, .3, 1);
      cursor: default;
      overflow: hidden;
    }

    .mod-frame {
      position: relative;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(62, 65, 69, .1);
      background: rgba(255, 255, 255, .3);
      overflow: hidden;
      transition: all .4s ease;
    }

    .mod-art {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mod-art svg {
      width: 80%;
      height: 80%;
      display: block;
      transition: transform .5s cubic-bezier(.16, 1, .3, 1), opacity 0.4s ease;
    }

    .mod-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .4s ease, transform .5s cubic-bezier(.16, 1, .3, 1);
      z-index: 2;
    }

    .mod-img.on {
      opacity: 1;
    }

    .mod-card:hover .mod-img.on {
      transform: scale(1.05);
    }

    .mod-card:hover .mod-frame {
      border-color: #000000;
      background: rgba(255, 255, 255, 0.9);
    }

    /* Hide the underlying SVG schematic permanently once the image is loaded */
    .mod-frame.has-img svg {
      opacity: 0;
    }

    .mod-card:hover .mod-art svg {
      transform: scale(1.05);
    }

    .mod-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 2;
    }

    .mod-tag {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 1px;
      color: var(--teal);
      text-transform: uppercase;
      font-weight: 600;
    }

    .mod-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      color: var(--charcoal);
    }

    .mod-sub {
      font-family: var(--sans);
      font-size: 9px;
      color: var(--slate);
      line-height: 1.25;
    }

    .mod-extender {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(19, 138, 165, 0.08));
      opacity: 0;
      transition: opacity .4s ease;
      pointer-events: none;
      z-index: 1;
    }

    .mod-card:hover .mod-extender {
      opacity: 1;
    }

    .mod-card:hover {
      border-color: var(--teal);
      box-shadow: 0 8px 24px rgba(19, 138, 165, 0.1), 0 0 0 4px rgba(19, 138, 165, 0.05);
      transform: translateY(-2px);
    }

    /* Only allow interactions on interactive elements when their parent scene is active */
    .scene.is-active .col-text,
    .scene.is-active .col-art,
    .scene.is-active .mods-ticker-container,
    .scene.is-active .layer-row {
      pointer-events: auto;
    }

    /* Dynamic full-screen width background blur band */
    .scene-blur-band {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 112%;
      min-height: 400px;
      background: rgba(244, 244, 246, 0.45);
      backdrop-filter: blur(28px) saturate(110%);
      -webkit-backdrop-filter: blur(28px) saturate(110%);
      border-top: 1.5px solid rgba(62, 65, 69, 0.05);
      border-bottom: 1.5px solid rgba(62, 65, 69, 0.05);
      pointer-events: none;
      z-index: 0;
    }

    /* Ensure scene-inner content is relative and in front of the blur band */
    .scene-inner {
      position: relative;
      z-index: 2;
    }

    /* Hero section specific title and accent overrides to match first image */
    #scene-hero h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: clamp(2.3rem, 5.2vw, 4.2rem) !important;
      letter-spacing: -1.5px !important;
      color: var(--charcoal) !important;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    #scene-hero h2 .accent {
      color: var(--charcoal) !important;
      text-shadow: none !important;
    }

    #scene-hero h2 .accent::after {
      display: none !important;
    }

    /* Responsive height overrides for narrow/short viewports to prevent overflow */
    @media (max-height: 840px) {
      .scene {
        padding: 96px 6vw 32px;
      }

      .mods-ticker-container {
        margin-top: 14px;
        gap: 12px;
      }

      .mods-ticker-lane {
        gap: 24px;
      }

      .mod-card {
        width: 210px;
        padding: 10px;
        gap: 8px;
      }

      .mod-info {
        gap: 2px;
      }

      .mod-tag {
        font-size: 8px;
      }

      .mod-label {
        font-size: 11px;
      }

      .mod-sub {
        font-size: 9.5px;
        line-height: 1.2;
      }
    }

    @media (max-height: 700px) {
      .scene {
        padding: 80px 6vw 20px;
      }

      .mods-ticker-container {
        margin-top: 10px;
        gap: 8px;
      }

      .mods-ticker-lane {
        gap: 16px;
      }

      .mod-card {
        width: 170px;
        padding: 8px;
        gap: 6px;
      }

      .mod-info {
        gap: 1px;
      }

      .mod-tag {
        font-size: 7.5px;
        letter-spacing: 1px;
      }

      .mod-label {
        font-size: 9.5px;
      }

      .mod-sub {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- Fixed Spline DNA background (never moves) -->
  <div class="bg-stack">
    <div class="dna-viewport">
      <spline-viewer loading-anim-type="none" lazy="false" url="dna_scene.splinecode"></spline-viewer>
    </div>
    <div class="dna-placeholder" id="dna-placeholder">
      <div class="css-dna" id="css-dna"></div>
    </div>
    <div class="bg-grid"></div>
    <div class="bg-scrim"></div>
  </div>

  <!-- Top chrome -->
  <div class="progress-bar" id="progress-bar"></div>
  <div class="chromium-top" id="nav-container">
    <div class="nav-content-wrapper">
      <div class="brand">
        <img src="/assets/logo1.png" alt="QuantumShield Logo" class="brand-logo" />
        <div>
          <h1>QuantumShield</h1>
          <div class="sub">Quantum Drug Discovery · A–Z</div>
        </div>
      </div>

      <div class="nav-pill-container">
        <div class="nav-pill-bar" id="nav-pill-bar"></div>

      <div class="top-nav">
        <div class="live"><span class="dot"></span> QPU · STATEVECTOR READY</div>
        <button class="btn-enter js-enter" id="btn-enter" type="button">Enter Platform ↗</button>

  <!-- Scene deck (fixed, crossfades) -->
  <div class="deck" id="deck"></div>



  <!-- Counter -->
  <div class="counter" id="counter">SCENE <span class="now" id="counter-now">01</span><span class="sep">/</span><span
      id="counter-total">18</span></div>

  <!-- Scroll hint -->
  <div class="scroll-hint" id="scroll-hint"><span>Scroll to explore</span><span class="arr">↓</span></div>

  <!-- Spacer that defines total scroll length -->
  <div class="scroller" id="scroller"></div>

  <!-- Transition overlay -->
  <div class="transition-overlay" id="transition-overlay">
    <div class="transition-backdrop"></div>
    <div class="watermark-field" id="watermark-field"></div>
    <div class="particle-field" id="particle-field"></div>
    <div class="pathogen-hud-container">
      <div class="target-bracket bracket-tl"></div>
      <div class="target-bracket bracket-tr"></div>
      <div class="target-bracket bracket-bl"></div>
      <div class="target-bracket bracket-br"></div>
      <div class="hud-scanner-rings">
        <div class="scanner-ring ring-outer"></div>
        <div class="scanner-ring ring-middle"></div>
        <div class="scanner-ring ring-inner"></div>
        <div class="scanner-sweep-line"></div>
      </div>
      <img src="images/virus_target.png" alt="" class="pathogen-image" id="hud-virus-image"
        onerror="this.style.display='none'" />
      <div class="target-stats-overlay">
        <div>TGT: INHA · MUTATION I194T</div>
        <div id="target-coords">COORD: [X: +14.28, Y: -8.94, Z: +32.11]</div>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-text" id="progress-bar-text">INITIALIZING SYSTEM... 0%</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </div>
    <div class="flash-overlay"></div>
  </div>

  <!-- scene data + engine injected -->
  <script src="scenes.js?v=171"></script>
  <script src="engine.js?v=171"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="enhance.js?v=171"></script>

  <!-- Diagnostic & Fallback script for hover interactions -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      console.log('Hover diagnostic script loaded.');

      document.body.addEventListener('mouseenter', function (e) {
        var row = e.target.closest('.layer-row');
        if (row) {
          console.log('JS Hover ENTER:', row.querySelector('.ln').textContent);
          row.style.setProperty('background', '#121315', 'important');
          row.style.setProperty('border-color', '#138aa5', 'important');
          row.style.setProperty('transform', 'translateX(8px)', 'important');
          row.style.setProperty('padding-left', '18px', 'important');
          row.style.setProperty('cursor', 'pointer', 'important');

          var lt = row.querySelector('.lt');
          if (lt) lt.style.setProperty('color', '#ffffff', 'important');
          var ln = row.querySelector('.ln');
          if (ln) {
            ln.style.setProperty('color', '#14b8a6', 'important');
            ln.style.setProperty('letter-spacing', '2px', 'important');
          }
          var ld = row.querySelector('.ld');
          if (ld) ld.style.setProperty('color', '#94a3b8', 'important');
          var ls = row.querySelector('.ls');
          if (ls) ls.style.setProperty('color', '#cbd5e1', 'important');
        }
      }, true);

      document.body.addEventListener('mouseleave', function (e) {
        var row = e.target.closest('.layer-row');
        if (row) {
          console.log('JS Hover LEAVE:', row.querySelector('.ln').textContent);
          row.style.removeProperty('background');
          row.style.removeProperty('border-color');
          row.style.removeProperty('transform');
          row.style.removeProperty('padding-left');
          row.style.removeProperty('cursor');

          var lt = row.querySelector('.lt');
          if (lt) lt.style.removeProperty('color');
          var ln = row.querySelector('.ln');
          if (ln) {
            ln.style.removeProperty('color');
            ln.style.removeProperty('letter-spacing');
          }
          var ld = row.querySelector('.ld');
          if (ld) ld.style.removeProperty('color');
          var ls = row.querySelector('.ls');
          if (ls) ls.style.removeProperty('color');
        }
      }, true);
    });
  </script>
</body>
